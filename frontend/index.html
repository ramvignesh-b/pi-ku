<!doctype html>
<html lang="en" data-theme="piku">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pi. Ku. | A safe haven for your unsaid and unsent letters</title>
    <meta name="description"
        content="Pi. Ku. is a minimal, secure, and beautiful way to write and seal your unsaid words into digital letters." />
    <link rel="canonical" href="https://writepiku.app/" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Link previews. Scrapers (Slack, Discord, WhatsApp, Facebook) do not run JS,
         so everything they read has to be static in this head. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pi. Ku." />
    <meta property="og:url" content="https://writepiku.app/" />
    <meta property="og:title" content="Pi. Ku. | A safe haven for your unsaid and unsent letters" />
    <meta property="og:description"
        content="Pi. Ku. is a minimal, secure, and beautiful way to write and seal your unsaid words into digital letters." />
    <meta property="og:image" content="https://writepiku.app/android-chrome-512x512.png" />
    <meta property="og:image:alt" content="The Pi. Ku. wax seal" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Pi. Ku. | A safe haven for your unsaid and unsent letters" />
    <meta name="twitter:description"
        content="Pi. Ku. is a minimal, secure, and beautiful way to write and seal your unsaid words into digital letters." />
    <meta name="twitter:image" content="https://writepiku.app/android-chrome-512x512.png" />

    <!-- Pi. Ku. is a dark app and this stylesheet blocks the first paint, so
         name the background here too. Without it the browser shows white until
         the bundle lands. Mirrors --color-base-200 in src/index.css. -->
    <style>
        :root { color-scheme: dark; }
        html, body { margin: 0; height: 100%; background: oklch(18% 0.014 33); }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
